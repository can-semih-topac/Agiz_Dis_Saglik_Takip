server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular istemci taraflı yönlendirme kullanıyor (Router) — bilinmeyen bir yol için
    # nginx'in 404 dönmesi yerine her zaman index.html'e düşmesi gerekiyor, aksi halde
    # "/login" gibi bir adrese doğrudan girildiğinde (F5) sayfa bulunamaz hatası alınır.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
