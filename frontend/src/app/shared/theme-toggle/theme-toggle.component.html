<button
  type="button"
  class="theme-switch"
  [class.is-dark]="resolved() === 'dark'"
  (click)="toggle()"
  role="switch"
  [attr.aria-checked]="resolved() === 'dark'"
  [attr.aria-label]="(resolved() === 'dark' ? 'common.switchToLightTheme' : 'common.switchToDarkTheme') | transloco"
  [title]="(resolved() === 'dark' ? 'common.switchToLightTheme' : 'common.switchToDarkTheme') | transloco">
  <span class="theme-switch-knob">{{ resolved() === 'dark' ? '🌙' : '☀️' }}</span>
</button>
