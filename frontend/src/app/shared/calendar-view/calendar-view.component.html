<div class="calendar">
  <div class="calendar-header">
    <button type="button" class="calendar-nav" (click)="prevMonth()" [attr.aria-label]="'calendarView.prevAria' | transloco">‹</button>
    <span class="calendar-title">{{ monthNames[viewMonth] | transloco }} {{ viewYear }}</span>
    <button type="button" class="calendar-nav" (click)="nextMonth()" [attr.aria-label]="'calendarView.nextAria' | transloco">›</button>
  </div>

  <div class="calendar-grid calendar-day-headers">
    @for (h of dayHeaders; track h) {
      <span class="calendar-day-header">{{ h | transloco }}</span>
    }
  </div>

  @for (week of weeks; track $index) {
    <div class="calendar-grid">
      @for (day of week; track day?.date ?? $index) {
        @if (day) {
          <button
            type="button"
            class="calendar-day"
            [class.has-records]="day.hasRecords"
            [class.is-today]="day.isToday"
            [class.is-selected]="isSelected(day)"
            (click)="selectDay(day)">
            {{ day.day }}
          </button>
        } @else {
          <span class="calendar-day calendar-day-empty"></span>
        }
      }
    </div>
  }
</div>
