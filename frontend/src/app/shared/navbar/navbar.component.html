<header class="navbar">
  <span class="navbar-greeting">{{ pageTitle || ('navbar.greeting' | transloco: { name: fullName }) }}</span>

  <nav class="navbar-actions">
    <a routerLink="/health" class="navbar-btn">
      <span class="navbar-btn-icon">🦷</span> {{ 'navbar.habitManagement' | transloco }}
    </a>
    <button type="button" class="navbar-btn" (click)="showContactModal = true">
      <span class="navbar-btn-icon">✉</span> {{ 'common.contactUs' | transloco }}
    </button>
    @if (isAdmin) {
      <a routerLink="/admin" class="navbar-btn">
        <span class="navbar-btn-icon">🛡️</span> {{ 'navbar.adminPanel' | transloco }}
      </a>
    }
    <a routerLink="/profile" class="navbar-avatar" [title]="'navbar.profileTitle' | transloco">👤</a>
    <a routerLink="/settings" class="navbar-avatar" [title]="'navbar.settingsTitle' | transloco">⚙️</a>
    <button (click)="logout()">{{ 'navbar.logout' | transloco }}</button>
  </nav>
</header>

@if (showContactModal) {
  <app-contact-modal
    [prefillFullName]="fullName"
    [prefillEmail]="email"
    (closed)="showContactModal = false"></app-contact-modal>
}
