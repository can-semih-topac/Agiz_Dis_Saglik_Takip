<header class="navbar">
  <span class="navbar-greeting">{{ displayTitle }}</span>

  <nav class="navbar-actions">
    <a routerLink="/health">Ağız ve Diş Sağlığı</a>
    <button type="button" class="contact-btn" (click)="showContactModal = true">
      <span class="contact-btn-icon">✉</span> Bize Ulaşın
    </button>
    <a routerLink="/profile" class="navbar-avatar" title="Profil">👤</a>
    <button (click)="logout()">Çıkış Yap</button>
  </nav>
</header>

@if (showContactModal) {
  <app-contact-modal
    [prefillFullName]="fullName"
    [prefillEmail]="email"
    (closed)="showContactModal = false"></app-contact-modal>
}
