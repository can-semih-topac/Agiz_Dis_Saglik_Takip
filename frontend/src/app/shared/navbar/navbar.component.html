<header class="navbar">
  <span class="navbar-greeting">{{ displayTitle }}</span>

  <nav class="navbar-actions">
    <a routerLink="/health" class="navbar-btn">
      <span class="navbar-btn-icon">🦷</span> Ağız ve Diş Sağlığı
    </a>
    <button type="button" class="navbar-btn" (click)="showContactModal = true">
      <span class="navbar-btn-icon">✉</span> Bize Ulaşın
    </button>
    <a routerLink="/profile" class="navbar-avatar" title="Profil">👤</a>
    <button (click)="logout()">Çıkış Yap</button>
  </nav>
</header>

@if (showContactModal) {
  <app-contact-modal
    [prefillFullName]="fullName"
    [prefillEmail]="email"
    (closed)="showContactModal = false"></app-contact-modal>
}
