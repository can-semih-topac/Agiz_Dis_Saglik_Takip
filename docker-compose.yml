# Faz 2 tamamlandı: backend + frontend + Redis + ElasticSearch + MSSQL hepsi container'da.
# SonarQube, Jenkins, cloudflared şimdilik host'ta (makinede) doğrudan çalışmaya devam ediyor.
#
# MSSQL verisi native SQL Server'dan BACKUP/RESTORE ile taşındı (bkz. proje geçmişi) — native
# SQL Server kurulumu bilerek KAPATILMADI, güvenlik ağı olarak bir süre daha ayakta kalacak.
#
# "name" sabitlenmezse Docker Compose proje adını klasör adından türetiyor — benim kendi
# checkout'um ("agiz_dis_saglik_takip") ile Jenkins'in workspace'i ("agiz-dis-saglik-takip")
# FARKLI klasör adlarına sahip, yani sabitlemezsek ikisi ayrı birer "proje" sayılıp aynı
# canlı portlarda (5299/4300) çakışıyor. Sabitleyince nereden çalıştırılırsa çalıştırılsın
# hep AYNI, tek bir canlı dağıtım olarak tanınıyor.
name: ads-takip

services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-5299}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      # "redis"/"elasticsearch" — host.docker.internal değil, çünkü artık ikisi de bu compose
      # ağının içinde, kendi servis adlarıyla doğrudan erişilebiliyor.
      - Redis__Configuration=redis:6379
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Jwt__Issuer=AgizDisSaglikTakip
      - Jwt__Audience=AgizDisSaglikTakipClient
      - Jwt__ExpirationMinutes=60
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Encryption__AesKey=${ENCRYPTION_AES_KEY}
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SenderEmail=can.semih.topac18@gmail.com
      - Email__SenderName=Agiz ve Dis Sagligi Takip
      - Email__SenderPassword=${EMAIL_SENDER_PASSWORD}
      - Google__ClientId=453760525742-al563c48uhhb3b3886mp75f8fniadi1t.apps.googleusercontent.com
      - Sentry__Dsn=${SENTRY_DSN}
    volumes:
      # Kullanıcıların yüklediği görseller (profil fotoğrafı, durum notu resmi) container
      # yeniden oluşturulduğunda kaybolmasın diye kalıcı bir volume'de tutuluyor.
      - backend-uploads:/app/wwwroot
    depends_on:
      - db
      - redis
      - elasticsearch
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4300}:80"
    restart: always

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
    restart: always

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Asıl gizli olan tünel kimlik bilgisi dosyası repo'da değil — makineye özel yolu
      # .env'den okunuyor (bkz. .env.example).
      - ${CLOUDFLARED_CREDENTIALS_PATH}:/etc/cloudflared/bcd1f346-d1e4-46fb-9420-5221f8dbd536.json:ro
    extra_hosts:
      # Jenkins henüz container'lanmadı, host'ta çalışıyor.
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
    restart: always

  elasticsearch:
    # Yerel kurulumla (8.19.19) aynı sürüm — istemci kütüphanesiyle (Elastic.Clients.Elasticsearch
    # 8.19.24) uyumluluk için sürümleri yakın tutmak önemli.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    environment:
      # Tek node, kümeleme yok — kişisel proje için gereksiz karmaşıklık olurdu.
      - discovery.type=single-node
      # Yerel kurulumda da güvenlik/parola yoktu (ElasticsearchClient hiç kimlik bilgisi
      # göndermiyor) — container'da da aynı basit kurulumu koruyoruz.
      - xpack.security.enabled=false
      # Varsayılan JVM heap boyutu çok büyük olurdu — kişisel projenin log hacmi için 512MB yeterli.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: always

volumes:
  backend-uploads:
  redis-data:
  elasticsearch-data:
  mssql-data:
